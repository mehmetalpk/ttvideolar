<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=cl(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const eOut=t=>{t=cl(t);return 1-Math.pow(1-t,3)};
const back=t=>{t=cl(t);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const prog=(t,a,b)=>cl((t-a)/(b-a));
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
const F='Inter';

function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function grad(y0,y1,stops){const g=x.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g}

// ---------- text ----------
function wrap(text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
function caption(text,t,s,e,opt={}){
  if(t<s||t>e)return;
  const lt=t-s, size=opt.size||66, y=Math.min(opt.y||1150,1250), color=opt.color||'#fff';
  const sc=0.8+0.2*back(lt/0.22), a=cl(lt/0.12)*cl((e-t)/0.12);
  x.save();x.globalAlpha=a;x.font=`800 ${size}px ${F}`;x.textAlign='center';x.textBaseline='middle';
  const lines=wrap(text,opt.maxW||880);const lh=size*1.2;const y0=y-(lines.length-1)*lh/2;
  x.translate(W/2,y);x.scale(sc,sc);x.translate(-W/2,-y);
  x.lineJoin='round';
  lines.forEach((l,i)=>{const yy=y0+i*lh;x.lineWidth=size*0.2;x.strokeStyle='#000';x.strokeText(l,W/2,yy);x.fillStyle=color;x.fillText(l,W/2,yy)});
  x.restore();
}

// ---------- people ----------
function body(cx,cy,w,h,col){x.fillStyle=col;x.beginPath();x.moveTo(cx-w/2,cy+h);x.lineTo(cx-w/2,cy+w*0.28);x.quadraticCurveTo(cx-w/2,cy,cx-w*0.22,cy);x.lineTo(cx+w*0.22,cy);x.quadraticCurveTo(cx+w/2,cy,cx+w/2,cy+w*0.28);x.lineTo(cx+w/2,cy+h);x.closePath();x.fill();}
function face(cx,cy,r,o={}){
  const skin=o.skin||'#e8b48c', hair=o.hair||'#2b1d16';
  x.save();
  if(o.hairStyle==='long'){x.fillStyle=hair;x.beginPath();x.ellipse(cx,cy+r*0.35,r*1.12,r*1.3,0,0,7);x.fill();}
  // neck
  x.fillStyle=o.skinShade||'#cf9a73';x.fillRect(cx-r*0.32,cy+r*0.6,r*0.64,r*0.6);
  x.fillStyle=skin;
  x.beginPath();x.ellipse(cx-r*0.88,cy+r*0.1,r*0.15,r*0.22,0,0,7);x.ellipse(cx+r*0.88,cy+r*0.1,r*0.15,r*0.22,0,0,7);x.fill();
  x.beginPath();x.ellipse(cx,cy,r*0.88,r,0,0,7);x.fill();
  // blush
  if(o.blush){x.fillStyle='rgba(230,110,110,0.25)';x.beginPath();x.ellipse(cx-r*0.5,cy+r*0.25,r*0.16,r*0.1,0,0,7);x.ellipse(cx+r*0.5,cy+r*0.25,r*0.16,r*0.1,0,0,7);x.fill();}
  // hair top
  x.fillStyle=hair;
  if(o.hairStyle!=='bald'){
    x.beginPath();x.moveTo(cx-r*0.92,cy-r*0.05);
    x.bezierCurveTo(cx-r*1.0,cy-r*1.25,cx+r*1.0,cy-r*1.25,cx+r*0.92,cy-r*0.05);
    x.quadraticCurveTo(cx+r*0.8,cy-r*0.55,cx+r*0.2,cy-r*0.58);
    x.quadraticCurveTo(cx-r*0.5,cy-r*0.5,cx-r*0.92,cy-r*0.05);x.fill();
  }
  if(o.cap){x.fillStyle=o.cap;x.beginPath();x.ellipse(cx,cy-r*0.55,r*0.95,r*0.55,0,Math.PI,0);x.fill();rr(cx-r*0.3,cy-r*0.62,r*1.35,r*0.16,r*0.08);x.fill();}
  if(o.beard){x.fillStyle=o.beard;x.beginPath();x.moveTo(cx-r*0.86,cy+r*0.05);x.quadraticCurveTo(cx-r*0.8,cy+r*1.05,cx,cy+r*1.05);x.quadraticCurveTo(cx+r*0.8,cy+r*1.05,cx+r*0.86,cy+r*0.05);x.quadraticCurveTo(cx+r*0.6,cy+r*0.55,cx,cy+r*0.5);x.quadraticCurveTo(cx-r*0.6,cy+r*0.55,cx-r*0.86,cy+r*0.05);x.fill();}
  // eyes
  const lk=(o.look||0)*r*0.08, eo=o.eyeOpen==null?1:o.eyeOpen, ey=cy-r*0.02;
  x.fillStyle='#1d1a22';
  [-1,1].forEach(s=>{x.beginPath();x.ellipse(cx+s*r*0.33+lk,ey+(o.lookDown||0)*r*0.06,r*0.085,Math.max(r*0.012,r*0.11*eo),0,0,7);x.fill();});
  if(eo>0.5){x.fillStyle='#fff';[-1,1].forEach(s=>{x.beginPath();x.arc(cx+s*r*0.33+lk+r*0.03,ey-r*0.035,r*0.025,0,7);x.fill()});}
  // brows
  const br=o.brow||0, sad=o.sad||0;
  x.strokeStyle=o.browCol||hair;x.lineWidth=r*0.07;x.lineCap='round';
  const ang=o.angry||0;[-1,1].forEach(s=>{x.beginPath();x.moveTo(cx+s*r*0.18,cy-r*0.27-br*r*0.12-sad*r*0.08+ang*r*0.1);x.lineTo(cx+s*r*0.48,cy-r*0.25-br*r*0.12+sad*r*0.04-ang*r*0.08);x.stroke();});
  // nose
  x.strokeStyle=o.skinShade||'#c48f69';x.lineWidth=r*0.045;x.beginPath();x.moveTo(cx,cy+r*0.05);x.quadraticCurveTo(cx+r*0.08,cy+r*0.22,cx-r*0.02,cy+r*0.25);x.stroke();
  // mustache
  if(o.mustache){x.fillStyle=o.mustache;x.beginPath();x.ellipse(cx-r*0.13,cy+r*0.36,r*0.17,r*0.07,0.15,0,7);x.ellipse(cx+r*0.13,cy+r*0.36,r*0.17,r*0.07,-0.15,0,7);x.fill();}
  // mouth
  const my=cy+r*0.5, sm=o.smile||0;
  if(o.mouthOpen>0){x.fillStyle='#5a1f25';x.beginPath();x.ellipse(cx,my+r*0.02,r*0.18,r*0.04+r*0.13*o.mouthOpen,0,0,7);x.fill();}
  else{x.strokeStyle='#6a2c2c';x.lineWidth=r*0.05;x.beginPath();x.moveTo(cx-r*0.2,my);x.quadraticCurveTo(cx,my+sm*r*0.22,cx+r*0.2,my);x.stroke();}
  x.restore();
}

// ---------- shared backgrounds ----------
function nightSky(){x.fillStyle=grad(0,H,['#070b1e','#141c44','#2a2459']);x.fillRect(0,0,W,H);const r=rng(7);x.fillStyle='#fff';for(let i=0;i<90;i++){x.globalAlpha=0.3+r()*0.6;x.beginPath();x.arc(r()*W,r()*1100,r()*2.5+0.5,0,7);x.fill()}x.globalAlpha=1;}
function skyline(off,baseY,seed,col,win){const r=rng(seed);let px=-200+(off%400);x.fillStyle=col;const bs=[];for(let i=0;i<14;i++){const w=110+r()*120,h=250+r()*520;bs.push([px,baseY-h,w,h]);px+=w+8;}bs.forEach(b=>x.fillRect(...b));if(win){bs.forEach(([bx,by,bw,bh],k)=>{const rr2=rng(seed*31+k);for(let wy=by+30;wy<baseY-30;wy+=52)for(let wx=bx+18;wx<bx+bw-30;wx+=40){if(rr2()<0.35){x.fillStyle=rr2()<0.5?'#ffd77a':'#ffb84d';x.globalAlpha=0.55+rr2()*0.4;x.fillRect(wx,wy,20,28)}}});x.globalAlpha=1;}}

function taxi(cx,cy,s){
  x.save();x.translate(cx,cy);x.scale(s,s);
  // beam
  const g=x.createLinearGradient(230,0,720,0);g.addColorStop(0,'rgba(255,240,180,0.55)');g.addColorStop(1,'rgba(255,240,180,0)');x.fillStyle=g;x.beginPath();x.moveTo(230,-10);x.lineTo(720,-90);x.lineTo(720,110);x.lineTo(230,30);x.fill();
  x.fillStyle='#f7c325';rr(-260,-60,520,120,40);x.fill();
  x.beginPath();x.moveTo(-170,-60);x.lineTo(-110,-150);x.lineTo(110,-150);x.lineTo(185,-60);x.fill();
  x.fillStyle='#22304f';x.beginPath();x.moveTo(-145,-62);x.lineTo(-98,-135);x.lineTo(-8,-135);x.lineTo(-8,-62);x.fill();x.beginPath();x.moveTo(8,-62);x.lineTo(8,-135);x.lineTo(100,-135);x.lineTo(160,-62);x.fill();
  // sign
  x.fillStyle='#111';rr(-60,-185,120,38,8);x.fill();x.fillStyle='#ffd23f';x.font=`800 26px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText('TAKSİ',0,-165);
  // checker
  for(let i=0;i<12;i++){x.fillStyle=i%2?'#111':'#f7c325';x.fillRect(-180+i*30,-8,30,16);}
  x.fillStyle='#fff6c8';x.beginPath();x.ellipse(250,-15,14,20,0,0,7);x.fill();
  x.fillStyle='#e23a3a';x.fillRect(-262,-30,10,26);
  [-150,150].forEach(w=>{x.fillStyle='#0d0d12';x.beginPath();x.arc(w,60,52,0,7);x.fill();x.fillStyle='#777';x.beginPath();x.arc(w,60,22,0,7);x.fill();});
  x.restore();
}


function bigText(tx,cx,cy,sz,col,p,rot=0){if(p<=0)return;const s=back(p);x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);x.font=`900 ${sz}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=sz*0.2;x.strokeStyle='#000';x.strokeText(tx,0,0);x.fillStyle=col;x.fillText(tx,0,0);x.restore();}

const PH=[[0, "Bir kuş, koca bir ülkeyi değiştirdi."], [2.53, "Hazreti Süleyman, kuşları teftiş ediyordu."], [4.84, "Ama bir eksik vardı: Hüdhüd yoktu."], [7.04, "Ya bana açık bir delil getirecek, ya da onu cezalandıracağım, dedi."], [10.85, "Çok geçmeden Hüdhüd geldi."], [12.59, "Senin bilmediğin bir şeyi öğrendim, dedi."], [14.7, "Sebe'den sana kesin bir haber getirdim."], [16.86, "Orada bir kadın hükümdar var."], [18.33, "Ona her şey verilmiş, büyük bir tahtı var."], [20.76, "Ama o ve halkı, Allah'ı bırakıp güneşe secde ediyor."], [23.96, "Süleyman, doğru mu söylüyorsun, yoksa yalancılardan mısın, bakacağız, dedi."], [28.45, "Ve bir mektup yazdı."], [29.7, "Devamı 2. partta. Kaçırmamak için takip et."], [32.89, ""]];

// ===== İSLAMİK STİL =====
const GR='#1f6b5e',GO='#c9a24a',CR='#f3e6c4',NV='#0d1230';
const VOW=/[aeıioöuüâîûAEIİOÖUÜ]/g;
function syl(w){const m=w.match(VOW);let n=m?m.length:1;if(/\d/.test(w))n=Math.max(n,4);return Math.max(1,n)}
const CAP=PH.slice(0,-1).map((p,i)=>{const words=p[1].split(' ');const ss=words.map(syl);const tot=ss.reduce((a,b)=>a+b,0);const dur=(PH[i+1][0]-p[0])*0.88;let acc=p[0];const st=words.map((w,k)=>{const s=acc;acc+=dur*ss[k]/tot;return s});return {s:p[0],e:PH[i+1][0],words,st}});
function karaoke(gt,y=1150){y=Math.min(y,1250);const c0=CAP.find(c=>gt>=c.s&&gt<c.e);if(!c0)return;const size=66;x.save();x.font=`800 ${size}px ${F}`;x.textAlign='left';x.textBaseline='middle';x.lineJoin='round';
 const lines=[[]];let lw=0;const sp=x.measureText(' ').width;c0.words.forEach((w,i)=>{const ww=x.measureText(w).width;if(lw+ww>900&&lines[lines.length-1].length){lines.push([]);lw=0}lines[lines.length-1].push(i);lw+=ww+sp});
 const lh=size*1.25,y0=y-(lines.length-1)*lh/2;let cur=0;c0.st.forEach((s,i)=>{if(gt>=s)cur=i});
 lines.forEach((ln,li)=>{const tw=ln.reduce((a,i)=>a+x.measureText(c0.words[i]).width,0)+sp*(ln.length-1);let px=W/2-tw/2;ln.forEach(i=>{const w=c0.words[i];const ww=x.measureText(w).width;x.lineWidth=size*0.22;x.strokeStyle='#000';x.strokeText(w,px,y0+li*lh);x.fillStyle=i===cur?'#ffd23f':'#fff';x.fillText(w,px,y0+li*lh);px+=ww+sp;});});x.restore();}
function watermark(){x.save();x.font=`700 40px ${F}`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.globalAlpha=0.6;x.lineWidth=6;x.strokeStyle='#000';x.strokeText('@islamikhikayeler',W/2,120);x.fillStyle='#fff';x.fillText('@islamikhikayeler',W/2,120);x.restore();}
function vignette(a=0.55){const g=x.createRadialGradient(W/2,H/2,300,W/2,H/2,1200);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,W,H);}
function star8(cx,cy,R,col,lw){x.save();x.strokeStyle=col;x.lineWidth=lw;x.beginPath();x.arc(cx,cy,R*0.9,0,7);x.stroke();x.beginPath();x.arc(cx,cy,R*0.55,0,7);x.stroke();x.fillStyle=col;x.beginPath();x.arc(cx,cy,R*0.15,0,7);x.fill();x.restore();}
function girih(col,alpha){x.save();x.globalAlpha=alpha;x.strokeStyle=col;x.lineWidth=3;for(let i=-1;i<9;i++)for(let j=0;j<12;j++){const cx=i*140+(j%2)*70,by=j*170+150;x.beginPath();x.moveTo(cx-45,by);x.lineTo(cx-45,by-70);x.quadraticCurveTo(cx-45,by-115,cx,by-140);x.quadraticCurveTo(cx+45,by-115,cx+45,by-70);x.lineTo(cx+45,by);x.stroke();}x.restore();}
function bgGreen(){const g=x.createRadialGradient(540,800,60,540,900,1300);g.addColorStop(0,'#1f6b5e');g.addColorStop(1,'#061a17');x.fillStyle=g;x.fillRect(0,0,W,H);girih(GO,0.1);}
function bgNight(){x.fillStyle=grad(0,H,['#070a1e','#1b1f45']);x.fillRect(0,0,W,H);const r=rng(5);x.fillStyle='#fff';for(let i=0;i<110;i++){x.globalAlpha=0.3+r()*0.6;x.beginPath();x.arc(r()*W,r()*1200,r()*2.5+0.5,0,7);x.fill();}x.globalAlpha=1;}
function bgCream(){x.fillStyle=grad(0,H,['#f1e2bd','#d8bf8a']);x.fillRect(0,0,W,H);girih(GR,0.15);}
function crescent(cx,cy,r,col){const o=document.createElement('canvas');o.width=o.height=Math.ceil(r*2+4);const q=o.getContext('2d');q.fillStyle=col;q.beginPath();q.arc(r+2,r+2,r,0,7);q.fill();q.globalCompositeOperation='destination-out';q.beginPath();q.arc(r+2+r*0.45,r+2-r*0.2,r*0.82,0,7);q.fill();x.drawImage(o,cx-r-2,cy-r-2);}
function mosque(cx,base,s,col){x.save();x.translate(cx,base);x.scale(s,s);x.fillStyle=col;x.fillRect(-300,-180,600,180);x.beginPath();x.arc(0,-180,170,Math.PI,0);x.fill();[[-220,90],[220,90]].forEach(([a,r])=>{x.beginPath();x.arc(a,-180,r,Math.PI,0);x.fill();});[[-400,560],[400,560]].forEach(([a,h])=>{x.fillRect(a-18,-h,36,h);x.beginPath();x.moveTo(a-24,-h);x.lineTo(a,-h-90);x.lineTo(a+24,-h);x.fill();});x.restore();}
function book(cx,cy,s,title,t){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#1f6b5e';rr(-340,-250,680,500,20);x.fill();x.fillStyle=CR;rr(-320,-230,310,460,10);x.fill();rr(10,-230,310,460,10);x.fill();
 x.strokeStyle=GO;x.lineWidth=6;rr(-300,-210,270,420,8);x.stroke();rr(30,-210,270,420,8);x.stroke();star8(-165,0,70,GO,5);star8(165,0,70,GO,5);x.restore();
 const g=x.createRadialGradient(cx,cy,30,cx,cy,500);g.addColorStop(0,`rgba(255,220,140,${0.25+0.1*Math.sin(t*3)})`);g.addColorStop(1,'rgba(255,220,140,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
 if(title)bigText(title,W/2,cy-s*360,96,'#ffd23f',1);}
function rays(cx,cy,t,col='rgba(255,230,160,0.18)'){x.save();x.translate(cx,cy);x.fillStyle=col;for(let i=0;i<12;i++){x.save();x.rotate(i*Math.PI/6+t*0.1);x.beginPath();x.moveTo(0,0);x.lineTo(-60,-1400);x.lineTo(60,-1400);x.fill();x.restore();}x.restore();}
function sil(cx,base,s,col){x.save();x.translate(cx,base);x.scale(s,s);x.fillStyle=col;x.beginPath();x.moveTo(-40,0);x.lineTo(-34,-120);x.quadraticCurveTo(0,-150,34,-120);x.lineTo(40,0);x.fill();x.beginPath();x.arc(0,-160,30,0,7);x.fill();x.restore();}
function frameText(lines,cy,t,p){if(p<=0)return;x.save();x.globalAlpha=cl(p*1.5);const w=900,h=lines.length*110+120;x.strokeStyle=GO;x.lineWidth=6;rr(90,cy-h/2,w,h,30);x.stroke();x.fillStyle='rgba(0,0,0,0.35)';rr(90,cy-h/2,w,h,30);x.fill();
 x.font=`800 72px ${F}`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';lines.forEach((l,i)=>{const yy=cy-(lines.length-1)*55+i*110;x.lineWidth=12;x.strokeStyle='#000';x.strokeText(l,W/2,yy);x.fillStyle='#f3e6c4';x.fillText(l,W/2,yy);});x.restore();}

// ===== İSLAMİK sahne parçaları =====
function shot(a,b,f){S.push({d:T[b+1]-T[a],g0:T[a],f});}
function cave(cx,cy,s,glow){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#3b2f2a';x.beginPath();x.moveTo(-900,500);x.lineTo(-600,-200);x.lineTo(-300,-420);x.lineTo(0,-520);x.lineTo(350,-380);x.lineTo(700,-150);x.lineTo(900,500);x.fill();
 x.fillStyle='#4f3f37';x.beginPath();x.moveTo(-500,500);x.lineTo(-250,-250);x.lineTo(150,-330);x.lineTo(500,500);x.fill();
 x.fillStyle='#0a0705';x.beginPath();x.moveTo(-260,500);x.lineTo(-260,40);x.quadraticCurveTo(0,-260,260,40);x.lineTo(260,500);x.fill();
 if(glow){const g=x.createRadialGradient(0,300,10,0,300,320);g.addColorStop(0,`rgba(255,215,130,${glow})`);g.addColorStop(1,'rgba(255,215,130,0)');x.fillStyle=g;x.fillRect(-300,-50,600,560);}x.restore();}
function ground(y,col){x.fillStyle=col;x.fillRect(0,y,W,H-y);}
function dog(cx,base,s,col){x.save();x.translate(cx,base);x.scale(s,s);x.fillStyle=col;
 x.beginPath();x.ellipse(0,-55,130,55,0,0,7);x.fill();// gövde
 x.fillRect(110,-40,150,26);x.fillRect(110,-14,170,22);// uzatılmış ön ayaklar
 x.beginPath();x.ellipse(150,-120,55,45,-0.2,0,7);x.fill();x.beginPath();x.ellipse(205,-105,40,22,0.1,0,7);x.fill();// baş+burun
 x.beginPath();x.moveTo(120,-150);x.lineTo(110,-205);x.lineTo(150,-160);x.fill();

function trainS(px,base,s,t){x.save();x.translate(px,base);x.scale(s,s);x.fillStyle='#1a1a24';for(let i=0;i<4;i++){rr(-i*330-300,-200,310,170,16);x.fill();x.fillStyle='rgba(255,215,120,0.85)';for(let k=0;k<3;k++)x.fillRect(-i*330-270+k*95,-170,60,60);x.fillStyle='#1a1a24';}x.fillStyle='#0a0a10';for(let i=0;i<8;i++){x.beginPath();x.arc(-i*165-60,-25,26,0,7);x.fill();}x.restore();}
function suitcase(cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#7a4a2a';rr(-200,-130,400,260,24);x.fill();x.strokeStyle='#4a2a14';x.lineWidth=14;rr(-60,-190,120,70,20);x.stroke();x.fillStyle='#c9a24a';x.fillRect(-140,-130,24,260);x.fillRect(116,-130,24,260);x.restore();}
function bridge(base,col){x.strokeStyle=col;x.fillStyle=col;x.fillRect(0,base-30,W,30);[300,780].forEach(px=>{x.fillRect(px-20,base-520,40,520);});x.lineWidth=6;x.beginPath();x.moveTo(-100,base-30);x.quadraticCurveTo(140,base-120,300,base-500);x.quadraticCurveTo(540,base-120,780,base-500);x.quadraticCurveTo(940,base-120,W+100,base-30);x.stroke();}

function table(t){x.fillStyle='#4a3020';rr(140,1050,800,90,20);x.fill();for(let i=0;i<5;i++)sil(220+i*160,1060,1.0,'#111');}

function poster(cx,cy,s,top,p){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#e9dcc0';x.fillRect(-300,-400,600,800);x.fillStyle='#3a2a1a';x.font=`900 90px Georgia,serif`;x.textAlign='center';x.fillText(top||'ARANIYOR',0,-290);x.fillStyle='#2a2a2a';x.fillRect(-180,-230,360,380);x.fillStyle='#0d0d0d';x.beginPath();x.arc(0,-90,90,0,7);x.fill();x.fillRect(-130,10,260,140);x.fillStyle='#e9dcc0';x.font=`900 140px ${F}`;x.fillText('?',0,-40);x.fillStyle='#3a2a1a';x.font=`800 54px ${F}`;x.fillText('D.B. COOPER',0,240);x.fillRect(-220,290,440,10);x.fillRect(-180,330,360,10);x.restore();}
function note(cx,cy,s,rot,txt,p){x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);x.fillStyle='#f7f3e6';x.fillRect(-300,-180,600,360);x.strokeStyle='#cfd8e8';x.lineWidth=3;for(let i=0;i<6;i++){x.beginPath();x.moveTo(-280,-120+i*55);x.lineTo(280,-120+i*55);x.stroke();}x.fillStyle='#b01020';x.font=`italic 800 70px Georgia,serif`;x.textAlign='center';x.textBaseline='middle';const L=txt.split('|');const n=Math.floor(L.join('').length*cl(p));let used=0;L.forEach((l,i)=>{const k=Math.max(0,Math.min(l.length,n-used));used+=l.length;x.fillText(l.slice(0,k),0,-40+i*95);});x.restore();}
function cash(cx,cy,s,rot){x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);x.fillStyle='#4f7a4a';x.fillRect(-120,-55,240,110);x.strokeStyle='#cfe3c0';x.lineWidth=5;x.strokeRect(-105,-42,210,84);x.fillStyle='#cfe3c0';x.beginPath();x.arc(0,0,28,0,7);x.fill();x.fillStyle='#4f7a4a';x.font=`900 34px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText('20',0,2);x.restore();}
function runway(t){x.fillStyle='#1a1c22';x.beginPath();x.moveTo(380,1000);x.lineTo(700,1000);x.lineTo(1080,1920);x.lineTo(0,1920);x.fill();x.fillStyle='#f0f0f0';for(let i=0;i<8;i++){const k=((i/8+t*0.4)%1);const y=1000+k*k*900,w=6+k*30,h=20+k*120;x.fillRect(540-w/2,y,w,h);}for(let i=0;i<10;i++){const k=i/10;x.fillStyle=i%2?'#ffcf5a':'#ff5a5a';x.beginPath();x.arc(380-k*380,1000+k*900,4+k*10,0,7);x.fill();x.beginPath();x.arc(700+k*380,1000+k*900,4+k*10,0,7);x.fill();}}
function planeRear(cx,cy,s,open){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#c8ccd4';x.beginPath();x.moveTo(-500,-60);x.lineTo(300,-80);x.quadraticCurveTo(420,-60,460,40);x.lineTo(-500,60);x.fill();x.beginPath();x.moveTo(220,-80);x.lineTo(420,-300);x.lineTo(480,-300);x.lineTo(430,-40);x.fill();x.fillStyle='#22262e';for(let i=0;i<8;i++)x.fillRect(-440+i*80,-40,36,30);x.save();x.translate(300,40);x.rotate(open*0.9);x.fillStyle='#9aa0aa';x.fillRect(-10,0,30,220);for(let i=0;i<6;i++)x.fillRect(-20,20+i*34,50,8);x.restore();x.restore();}
function forest(base,col,seed=3){const r=rng(seed);x.fillStyle=col;for(let i=0;i<16;i++){const px=r()*W,h=300+r()*400,w=90+r()*60;x.beginPath();x.moveTo(px,base-h);x.lineTo(px-w,base);x.lineTo(px+w,base);x.fill();}x.fillRect(0,base,W,H-base);}
function beams(t){x.fillStyle='rgba(255,240,190,0.16)';for(let i=0;i<3;i++){const a=Math.sin(t*1.5+i*2)*0.5;x.save();x.translate(200+i*340,1350);x.rotate(a);x.beginPath();x.moveTo(0,0);x.lineTo(-150,-900);x.lineTo(150,-900);x.fill();x.restore();}}
function cta(t){bgDoc('#4a0e1c','#140408');spot(540,850,600,0.25,'255,80,100');const hb=1+0.12*Math.max(0,Math.sin(t*6));x.save();x.translate(330,820);x.scale(2.2*hb,2.2*hb);x.fillStyle='#ff2d55';x.beginPath();x.moveTo(0,30);x.bezierCurveTo(-70,-20,-40,-80,0,-45);x.bezierCurveTo(40,-80,70,-20,0,30);x.fill();x.restore();
 const fb=eOut(cl((t-0.8)*3));x.save();x.translate(760,820);x.scale(fb,fb);x.fillStyle='#ff2d55';rr(-170,-80,340,160,80);x.fill();x.fillStyle='#fff';x.font=`900 64px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText('+ TAKİP',0,4);x.restore();
 for(let k=0;k<2;k++){const ph=((t*0.9+k*0.5)%1);x.strokeStyle=`rgba(255,45,85,${1-ph})`;x.lineWidth=8;rr(760-170-ph*60,820-80-ph*60,340+ph*120,160+ph*120,80+ph*60);x.stroke();}
 bigText('BEĞEN',W/2,420,140,'#ff2d55',1);bigText('& TAKİP ET',W/2,580,100,'#fff',eOut(cl((t-0.5)*3)));}
function diamond(cx,cy,s,t){x.save();x.translate(cx,cy);x.scale(s,s);const g=x.createLinearGradient(-60,-40,60,60);g.addColorStop(0,'#e8fbff');g.addColorStop(0.5,'#8fd8ff');g.addColorStop(1,'#d8f4ff');x.fillStyle=g;x.beginPath();x.moveTo(-60,-20);x.lineTo(-30,-50);x.lineTo(30,-50);x.lineTo(60,-20);x.lineTo(0,60);x.closePath();x.fill();x.strokeStyle='rgba(255,255,255,0.8)';x.lineWidth=3;x.beginPath();x.moveTo(-60,-20);x.lineTo(60,-20);x.moveTo(-30,-50);x.lineTo(-15,-20);x.lineTo(0,60);x.lineTo(15,-20);x.lineTo(30,-50);x.stroke();const sp=Math.max(0,Math.sin(t*4+cx));x.fillStyle=`rgba(255,255,255,${sp})`;x.beginPath();x.moveTo(20,-60);x.lineTo(26,-44);x.lineTo(42,-38);x.lineTo(26,-32);x.lineTo(20,-16);x.lineTo(14,-32);x.lineTo(-2,-38);x.lineTo(14,-44);x.fill();x.restore();}
function scatter(n,y0,y1,s,t,seed=8){const r=rng(seed);for(let i=0;i<n;i++)diamond(80+r()*920,y0+r()*(y1-y0),s*(0.5+r()*0.6),t);}
function vaultDoor(cx,cy,r,t,open=0){x.save();x.translate(cx,cy);x.fillStyle='#4a4f58';x.beginPath();x.arc(0,0,r*1.08,0,7);x.fill();x.scale(1-open*0.7,1);x.fillStyle='#8a9099';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.strokeStyle='#5c626b';x.lineWidth=r*0.05;x.beginPath();x.arc(0,0,r*0.8,0,7);x.stroke();x.rotate(t);x.strokeStyle='#3a3f46';x.lineWidth=r*0.07;for(let i=0;i<3;i++){x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(i*2.09)*r*0.45,Math.sin(i*2.09)*r*0.45);x.stroke();}x.fillStyle='#3a3f46';x.beginPath();x.arc(0,0,r*0.15,0,7);x.fill();x.restore();}
function sandwich(cx,cy,s,bite){x.save();x.translate(cx,cy);x.scale(s,s);if(bite){x.beginPath();x.moveTo(-260,-120);x.lineTo(60,-120);for(let i=0;i<6;i++){x.lineTo(i%2?60:20,-120+(i+1)*40);}x.lineTo(60,120);x.lineTo(-260,120);x.closePath();x.clip();}x.fillStyle='#e0b070';rr(-220,20,440,70,30);x.fill();x.fillStyle='#c0403a';for(let i=0;i<5;i++){x.beginPath();x.ellipse(-170+i*85,15,48,18,0,0,7);x.fill();}x.fillStyle='#7ac25a';x.fillRect(-210,-10,420,14);x.fillStyle='#e8bd7d';rr(-230,-90,460,80,40);x.fill();x.fillStyle='#d9a860';for(let i=0;i<8;i++){x.beginPath();x.ellipse(-180+i*50,-60,8,4,0.4,0,7);x.fill();}x.restore();}
function bars(t){x.fillStyle='#2a2d33';for(let i=0;i<8;i++)x.fillRect(60+i*135,0,26,H);x.fillRect(0,500,W,22);x.fillRect(0,1350,W,22);}
function lasers(t,a){x.strokeStyle=`rgba(255,40,40,${a})`;x.lineWidth=4;for(let i=0;i<7;i++){x.beginPath();x.moveTo(0,500+i*130+Math.sin(t+i)*20);x.lineTo(W,620+i*110);x.stroke();}}
function trashbag(cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#14161a';x.beginPath();x.moveTo(-120,100);x.quadraticCurveTo(-160,-40,-60,-110);x.lineTo(-20,-150);x.lineTo(20,-150);x.lineTo(60,-110);x.quadraticCurveTo(160,-40,120,100);x.closePath();x.fill();x.restore();}

function badge(cx,cy,txt,col,p){if(p<=0)return;x.save();x.translate(cx,cy);const s=back(cl(p));x.scale(s,s);x.font=`900 56px ${F}`;const w=Math.max(380,x.measureText(txt).width+80);x.fillStyle=col;rr(-w/2,-60,w,120,60);x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,0,4);x.restore();}
function stage(t){x.fillStyle='#0a0a10';x.fillRect(0,0,W,H);x.fillStyle='rgba(255,240,200,0.2)';x.beginPath();x.moveTo(440,0);x.lineTo(640,0);x.lineTo(820,1300);x.lineTo(260,1300);x.fill();x.fillStyle='#3a1c1c';x.fillRect(0,1300,W,H);}
function coins(t,n=18,seed=3){const r=rng(seed);for(let i=0;i<n;i++){const xx=r()*W,sp=300+r()*400,yy=((r()*H+t*sp)%(H+200))-100;x.save();x.translate(xx,yy);x.scale(Math.max(0.05,Math.abs(Math.cos(t*4+i))),1);x.fillStyle='#e0b640';x.beginPath();x.arc(0,0,30,0,7);x.fill();x.strokeStyle='#a07a20';x.lineWidth=5;x.stroke();x.restore();}}
function stampX(cx,cy,s,p){if(p<=0)return;const sc=1+(1-back(p))*0.8;x.save();x.translate(cx,cy);x.scale(s*sc,s*sc);x.rotate(-0.15);x.globalAlpha=cl(p*2);x.strokeStyle='#c1121f';x.lineWidth=26;x.lineCap='round';x.beginPath();x.moveTo(-80,-80);x.lineTo(80,80);x.moveTo(80,-80);x.lineTo(-80,80);x.stroke();x.restore();}
function fire(cx,base,w,h,t,a=1){const n=7;for(let i=0;i<n;i++){const k=i/(n-1)-0.5,fh=h*(1-Math.abs(k)*1.2)*(0.8+0.2*Math.sin(t*9+i*2)),fw=w/n*1.8,px=cx+k*w;if(fh<=0)continue;const g=x.createLinearGradient(0,base-fh,0,base);g.addColorStop(0,'rgba(255,230,120,0)');g.addColorStop(0.35,`rgba(255,170,40,${0.9*a})`);g.addColorStop(1,`rgba(210,50,20,${0.95*a})`);x.fillStyle=g;x.beginPath();x.moveTo(px-fw/2,base);x.quadraticCurveTo(px-fw*0.6,base-fh*0.5,px+Math.sin(t*5+i)*10,base-fh);x.quadraticCurveTo(px+fw*0.6,base-fh*0.5,px+fw/2,base);x.fill();}}
function mapArrow(ax,ay,bx,by,p,col='#ff3b3b'){if(p<=0)return;const q=cl(p);x.save();x.strokeStyle=col;x.lineWidth=12;x.setLineDash([26,18]);x.beginPath();x.moveTo(ax,ay);const mx=(ax+bx)/2,my=Math.min(ay,by)-150;const N=30;for(let i=1;i<=N*q;i++){const u=i/N;const px=(1-u)*(1-u)*ax+2*(1-u)*u*mx+u*u*bx,py=(1-u)*(1-u)*ay+2*(1-u)*u*my+u*u*by;x.lineTo(px,py);}x.stroke();x.setLineDash([]);x.fillStyle=col;x.beginPath();x.arc(ax,ay,16,0,7);x.fill();if(q>=1){x.beginPath();x.arc(bx,by,22,0,7);x.fill();}x.restore();}
function counter(v0,v1,p,cx,cy,sz,col,suf=''){const v=Math.round(v0+(v1-v0)*eOut(cl(p)));bigText(v.toLocaleString('tr-TR')+suf,cx,cy,sz,col,1);}
