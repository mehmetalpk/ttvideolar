<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const c=document.getElementById('c'),x=c.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=cl(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const eOut=t=>{t=cl(t);return 1-Math.pow(1-t,3)};
const back=t=>{t=cl(t);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const prog=(t,a,b)=>cl((t-a)/(b-a));
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
const F='Inter';

function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function grad(y0,y1,stops){const g=x.createLinearGradient(0,y0,0,y1);stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));return g}

// ---------- text ----------
function wrap(text,maxW){const words=text.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}
function caption(text,t,s,e,opt={}){
  if(t<s||t>e)return;
  const lt=t-s, size=opt.size||66, y=Math.min(opt.y||1150,1250), color=opt.color||'#fff';
  const sc=0.8+0.2*back(lt/0.22), a=cl(lt/0.12)*cl((e-t)/0.12);
  x.save();x.globalAlpha=a;x.font=`800 ${size}px ${F}`;x.textAlign='center';x.textBaseline='middle';
  const lines=wrap(text,opt.maxW||880);const lh=size*1.2;const y0=y-(lines.length-1)*lh/2;
  x.translate(W/2,y);x.scale(sc,sc);x.translate(-W/2,-y);
  x.lineJoin='round';
  lines.forEach((l,i)=>{const yy=y0+i*lh;x.lineWidth=size*0.2;x.strokeStyle='#000';x.strokeText(l,W/2,yy);x.fillStyle=color;x.fillText(l,W/2,yy)});
  x.restore();
}

// ---------- people ----------
function body(cx,cy,w,h,col){x.fillStyle=col;x.beginPath();x.moveTo(cx-w/2,cy+h);x.lineTo(cx-w/2,cy+w*0.28);x.quadraticCurveTo(cx-w/2,cy,cx-w*0.22,cy);x.lineTo(cx+w*0.22,cy);x.quadraticCurveTo(cx+w/2,cy,cx+w/2,cy+w*0.28);x.lineTo(cx+w/2,cy+h);x.closePath();x.fill();}
function face(cx,cy,r,o={}){
  const skin=o.skin||'#e8b48c', hair=o.hair||'#2b1d16';
  x.save();
  if(o.hairStyle==='long'){x.fillStyle=hair;x.beginPath();x.ellipse(cx,cy+r*0.35,r*1.12,r*1.3,0,0,7);x.fill();}
  // neck
  x.fillStyle=o.skinShade||'#cf9a73';x.fillRect(cx-r*0.32,cy+r*0.6,r*0.64,r*0.6);
  x.fillStyle=skin;
  x.beginPath();x.ellipse(cx-r*0.88,cy+r*0.1,r*0.15,r*0.22,0,0,7);x.ellipse(cx+r*0.88,cy+r*0.1,r*0.15,r*0.22,0,0,7);x.fill();
  x.beginPath();x.ellipse(cx,cy,r*0.88,r,0,0,7);x.fill();
  // blush
  if(o.blush){x.fillStyle='rgba(230,110,110,0.25)';x.beginPath();x.ellipse(cx-r*0.5,cy+r*0.25,r*0.16,r*0.1,0,0,7);x.ellipse(cx+r*0.5,cy+r*0.25,r*0.16,r*0.1,0,0,7);x.fill();}
  // hair top
  x.fillStyle=hair;
  if(o.hairStyle!=='bald'){
    x.beginPath();x.moveTo(cx-r*0.95,cy+r*0.05);
    x.bezierCurveTo(cx-r*1.1,cy-r*1.5,cx+r*1.1,cy-r*1.5,cx+r*0.95,cy+r*0.05);
    x.quadraticCurveTo(cx+r*0.85,cy-r*0.42,cx+r*0.25,cy-r*0.48);
    x.quadraticCurveTo(cx-r*0.55,cy-r*0.42,cx-r*0.95,cy+r*0.05);x.fill();
    x.beginPath();x.ellipse(cx,cy-r*0.9,r*0.7,r*0.24,0,0,7);x.fill(); // saç hacmi: kafa üstü asla açıkta kalmasın
  }
  if(o.cap){x.fillStyle=o.cap;x.beginPath();x.ellipse(cx,cy-r*0.55,r*0.95,r*0.55,0,Math.PI,0);x.fill();rr(cx-r*0.3,cy-r*0.62,r*1.35,r*0.16,r*0.08);x.fill();}
  if(o.beard){x.fillStyle=o.beard;x.beginPath();x.moveTo(cx-r*0.86,cy+r*0.05);x.quadraticCurveTo(cx-r*0.8,cy+r*1.05,cx,cy+r*1.05);x.quadraticCurveTo(cx+r*0.8,cy+r*1.05,cx+r*0.86,cy+r*0.05);x.quadraticCurveTo(cx+r*0.6,cy+r*0.55,cx,cy+r*0.5);x.quadraticCurveTo(cx-r*0.6,cy+r*0.55,cx-r*0.86,cy+r*0.05);x.fill();}
  // eyes
  const lk=(o.look||0)*r*0.08, eo=o.eyeOpen==null?1:o.eyeOpen, ey=cy-r*0.02;
  x.fillStyle='#1d1a22';
  [-1,1].forEach(s=>{x.beginPath();x.ellipse(cx+s*r*0.33+lk,ey+(o.lookDown||0)*r*0.06,r*0.085,Math.max(r*0.012,r*0.11*eo),0,0,7);x.fill();});
  if(eo>0.5){x.fillStyle='#fff';[-1,1].forEach(s=>{x.beginPath();x.arc(cx+s*r*0.33+lk+r*0.03,ey-r*0.035,r*0.025,0,7);x.fill()});}
  // brows
  const br=o.brow||0, sad=o.sad||0;
  x.strokeStyle=o.browCol||hair;x.lineWidth=r*0.07;x.lineCap='round';
  const ang=o.angry||0;[-1,1].forEach(s=>{x.beginPath();x.moveTo(cx+s*r*0.18,cy-r*0.27-br*r*0.12-sad*r*0.08+ang*r*0.1);x.lineTo(cx+s*r*0.48,cy-r*0.25-br*r*0.12+sad*r*0.04-ang*r*0.08);x.stroke();});
  // nose
  x.strokeStyle=o.skinShade||'#c48f69';x.lineWidth=r*0.045;x.beginPath();x.moveTo(cx,cy+r*0.05);x.quadraticCurveTo(cx+r*0.08,cy+r*0.22,cx-r*0.02,cy+r*0.25);x.stroke();
  // mustache
  if(o.mustache){x.fillStyle=o.mustache;x.beginPath();x.ellipse(cx-r*0.13,cy+r*0.36,r*0.17,r*0.07,0.15,0,7);x.ellipse(cx+r*0.13,cy+r*0.36,r*0.17,r*0.07,-0.15,0,7);x.fill();}
  // mouth
  const my=cy+r*0.5, sm=o.smile||0;
  if(o.mouthOpen>0){x.fillStyle='#5a1f25';x.beginPath();x.ellipse(cx,my+r*0.02,r*0.18,r*0.04+r*0.13*o.mouthOpen,0,0,7);x.fill();}
  else{x.strokeStyle='#6a2c2c';x.lineWidth=r*0.05;x.beginPath();x.moveTo(cx-r*0.2,my);x.quadraticCurveTo(cx,my+sm*r*0.22,cx+r*0.2,my);x.stroke();}
  x.restore();
}

// ---------- shared backgrounds ----------
function nightSky(){x.fillStyle=grad(0,H,['#070b1e','#141c44','#2a2459']);x.fillRect(0,0,W,H);const r=rng(7);x.fillStyle='#fff';for(let i=0;i<90;i++){x.globalAlpha=0.3+r()*0.6;x.beginPath();x.arc(r()*W,r()*1100,r()*2.5+0.5,0,7);x.fill()}x.globalAlpha=1;}
function skyline(off,baseY,seed,col,win){const r=rng(seed);let px=-200+(off%400);x.fillStyle=col;const bs=[];for(let i=0;i<14;i++){const w=110+r()*120,h=250+r()*520;bs.push([px,baseY-h,w,h]);px+=w+8;}bs.forEach(b=>x.fillRect(...b));if(win){bs.forEach(([bx,by,bw,bh],k)=>{const rr2=rng(seed*31+k);for(let wy=by+30;wy<baseY-30;wy+=52)for(let wx=bx+18;wx<bx+bw-30;wx+=40){if(rr2()<0.35){x.fillStyle=rr2()<0.5?'#ffd77a':'#ffb84d';x.globalAlpha=0.55+rr2()*0.4;x.fillRect(wx,wy,20,28)}}});x.globalAlpha=1;}}

function taxi(cx,cy,s){
  x.save();x.translate(cx,cy);x.scale(s,s);
  // beam
  const g=x.createLinearGradient(230,0,720,0);g.addColorStop(0,'rgba(255,240,180,0.55)');g.addColorStop(1,'rgba(255,240,180,0)');x.fillStyle=g;x.beginPath();x.moveTo(230,-10);x.lineTo(720,-90);x.lineTo(720,110);x.lineTo(230,30);x.fill();
  x.fillStyle='#f7c325';rr(-260,-60,520,120,40);x.fill();
  x.beginPath();x.moveTo(-170,-60);x.lineTo(-110,-150);x.lineTo(110,-150);x.lineTo(185,-60);x.fill();
  x.fillStyle='#22304f';x.beginPath();x.moveTo(-145,-62);x.lineTo(-98,-135);x.lineTo(-8,-135);x.lineTo(-8,-62);x.fill();x.beginPath();x.moveTo(8,-62);x.lineTo(8,-135);x.lineTo(100,-135);x.lineTo(160,-62);x.fill();
  // sign
  x.fillStyle='#111';rr(-60,-185,120,38,8);x.fill();x.fillStyle='#ffd23f';x.font=`800 26px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText('TAKSİ',0,-165);
  // checker
  for(let i=0;i<12;i++){x.fillStyle=i%2?'#111':'#f7c325';x.fillRect(-180+i*30,-8,30,16);}
  x.fillStyle='#fff6c8';x.beginPath();x.ellipse(250,-15,14,20,0,0,7);x.fill();
  x.fillStyle='#e23a3a';x.fillRect(-262,-30,10,26);
  [-150,150].forEach(w=>{x.fillStyle='#0d0d12';x.beginPath();x.arc(w,60,52,0,7);x.fill();x.fillStyle='#777';x.beginPath();x.arc(w,60,22,0,7);x.fill();});
  x.restore();
}

// ---------- story helpers ----------
const NAR={skin:'#eab896',hair:'#8a3b1e',hairStyle:'long',blush:true};
const NEI={skin:'#d9a07a',hair:'#1b1b1b',beard:'#1b1b1b',cap:'#c62839'};
function sky(top,bot){x.fillStyle=grad(0,H,[top,bot]);x.fillRect(0,0,W,H);}
function house(px,base,w,h,wall,roof,opt={}){
  x.fillStyle=wall;x.fillRect(px,base-h,w,h);
  x.fillStyle=roof;x.beginPath();x.moveTo(px-30,base-h);x.lineTo(px+w/2,base-h-170);x.lineTo(px+w+30,base-h);x.fill();
  const wins=opt.wins||[[0.18,0.2],[0.58,0.2]];
  wins.forEach(([wx,wy])=>{x.fillStyle=opt.lit?'#ffd77a':'#9cc7e8';rr(px+w*wx,base-h+h*wy,w*0.24,h*0.24,8);x.fill();x.strokeStyle='#fff';x.lineWidth=6;x.stroke();});
  if(opt.door!==false){x.fillStyle='#6b3f26';rr(px+w*0.4,base-h*0.42,w*0.2,h*0.42,8);x.fill();}
}
function note(cx,cy,s,col){x.fillStyle=col;x.strokeStyle=col;x.lineWidth=5*s;x.beginPath();x.ellipse(cx,cy,13*s,10*s,-0.4,0,7);x.fill();x.beginPath();x.moveTo(cx+11*s,cy-3*s);x.lineTo(cx+11*s,cy-48*s);x.lineTo(cx+30*s,cy-38*s);x.stroke();}
function speaker(cx,cy,s,t,on){
  x.save();x.translate(cx,cy);const sh=on?Math.sin(t*60)*4:0;x.translate(sh,0);x.scale(s,s);
  x.fillStyle='#222';rr(-70,-110,140,220,18);x.fill();
  [[-50,40],[ -15,-55]].forEach(([yy,r],i)=>{});
  x.fillStyle='#555';x.beginPath();x.arc(0,-50,32,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(0,-50,14,0,7);x.fill();
  const pul=on?1+0.06*Math.sin(t*40):1;x.fillStyle='#555';x.beginPath();x.arc(0,40,50*pul,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(0,40,22,0,7);x.fill();
  x.restore();
  if(on){x.strokeStyle='rgba(255,210,63,0.8)';x.lineWidth=8;for(let k=0;k<3;k++){const ph=((t*1.6+k/3)%1);x.globalAlpha=1-ph;x.beginPath();x.arc(cx,cy,(120+ph*260)*s,-0.6,0.6);x.stroke();x.beginPath();x.arc(cx,cy,(120+ph*260)*s,Math.PI-0.6,Math.PI+0.6);x.stroke();}x.globalAlpha=1;
    for(let k=0;k<6;k++){const ph=((t*0.7+k/6)%1);note(cx+Math.sin(k*2.3+t)*160*s+(k%2?120:-120)*s,cy-ph*420*s,1.2*s,['#ffd23f','#ff6b8a','#5ad1ff'][k%3]);}}
}
function clock(cx,cy,r,txt,shake){x.save();x.translate(cx+(shake?Math.sin(shake*80)*6:0),cy);x.fillStyle='#fff';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.strokeStyle='#e23a3a';x.lineWidth=r*0.1;x.stroke();x.fillStyle='#e23a3a';x.font=`900 ${r*0.46}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.fillText(txt,0,4);x.restore();}
function bird(cx,cy,s,col,ph,dir=1){
  x.save();x.translate(cx,cy);x.scale(s*dir,s);
  x.fillStyle=col;x.beginPath();x.ellipse(0,0,26,18,0,0,7);x.fill();x.beginPath();x.arc(20,-14,13,0,7);x.fill();
  x.fillStyle='#f0a020';x.beginPath();x.moveTo(31,-16);x.lineTo(44,-12);x.lineTo(31,-9);x.fill();
  x.fillStyle='#111';x.beginPath();x.arc(23,-17,3,0,7);x.fill();
  x.fillStyle=col;x.save();x.translate(-4,-4);x.rotate(-0.4-Math.abs(Math.sin(ph))*0.9);x.beginPath();x.ellipse(-14,0,24,10,0,0,7);x.fill();x.restore();
  x.beginPath();x.moveTo(-22,0);x.lineTo(-40,-6);x.lineTo(-40,8);x.fill();
  x.restore();
}
function shake(t,a,b,amt){if(t>a&&t<b){const k=1-(t-a)/(b-a);x.translate(Math.sin(t*90)*amt*k,Math.cos(t*70)*amt*k);}}
function bigText(tx,cx,cy,sz,col,p,rot=0){if(p<=0)return;const s=back(p);x.save();x.translate(cx,cy);x.rotate(rot);x.scale(s,s);x.font=`900 ${sz}px ${F}`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=sz*0.2;x.strokeStyle='#000';x.strokeText(tx,0,0);x.fillStyle=col;x.fillText(tx,0,0);x.restore();}
function grass(y){x.fillStyle='#4f8a3c';x.fillRect(0,y,W,H-y);x.fillStyle='#5f9e48';for(let i=0;i<40;i++){x.fillRect(i*28,y,10,18)}}
function feeder(cx,cy,s,sw){x.save();x.translate(cx,cy);x.rotate(sw);x.strokeStyle='#5b3b28';x.lineWidth=3;x.beginPath();x.moveTo(0,-120*s);x.lineTo(0,-40*s);x.stroke();x.scale(s,s);x.fillStyle='#c0392b';x.beginPath();x.moveTo(-45,-20);x.lineTo(0,-50);x.lineTo(45,-20);x.fill();x.fillStyle='#e9c46a';x.fillRect(-35,-20,70,55);x.fillStyle='#8a5a2b';x.fillRect(-35,30,70,10);x.fillStyle='#5b3b28';x.beginPath();x.arc(0,8,12,0,7);x.fill();x.restore();}
function car(cx,cy,s,col){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle=col;rr(-280,-70,560,130,45);x.fill();x.beginPath();x.moveTo(-170,-70);x.lineTo(-100,-170);x.lineTo(120,-170);x.lineTo(190,-70);x.fill();x.fillStyle='#22304f';x.beginPath();x.moveTo(-145,-72);x.lineTo(-92,-150);x.lineTo(-8,-150);x.lineTo(-8,-72);x.fill();x.beginPath();x.moveTo(8,-72);x.lineTo(8,-150);x.lineTo(110,-150);x.lineTo(165,-72);x.fill();[-160,160].forEach(w=>{x.fillStyle='#0d0d12';x.beginPath();x.arc(w,60,58,0,7);x.fill();x.fillStyle='#888';x.beginPath();x.arc(w,60,24,0,7);x.fill();});x.restore();}

// ---------- scenes ----------
const S=[];
// 0 HOOK
S.push({d:2.87,f(t){
  sky('#2b3a6b','#f2a65a');
  x.fillStyle='#ffe2a8';x.beginPath();x.arc(540,1180,180,0,7);x.fill();
  house(60,1350,420,420,'#3a3550','#2a2540',{door:false});house(600,1350,420,420,'#3a3550','#2a2540',{door:false});
  x.fillStyle='#1f1c2e';x.fillRect(0,1350,W,570);
  const r=rng(5);for(let i=0;i<26;i++){const sp=150+r()*250,yy=980+r()*380,xx=((r()*1400+t*sp)%1400)-160;bird(xx,yy,0.7+r()*0.6,'#1d1a2a',t*14+i);}
  bigText('Komşumdan',W/2,430,92,'#fff',prog(t,0.02,0.3));
  bigText('KUŞLARLA',W/2,570,138,'#ffd23f',prog(t,1.3,1.6));
  bigText('intikam aldım.',W/2,710,92,'#fff',prog(t,1.75,2.05));
}});
// 1 NEW NEIGHBOR + MUSIC
S.push({d:5.41,f(t){
  const on=t>2.2;
  sky(on?'#1b2350':'#8ec5f0',on?'#e98a5f':'#dff1ff');
  grass(1250);
  house(60,1250,420,420,'#e8d5b5','#a0522d');house(600,1250,420,420,'#b5c9e8','#3b4f7a');
  x.fillStyle='#fff';x.font=`700 34px ${F}`;x.textAlign='center';x.fillText('BEN',270,1300);x.fillText('YENİ KOMŞU',810,1300);
  // narrator in window
  x.save();rr(60+420*0.18,1250-420+420*0.2,420*0.24,420*0.24,8);x.clip();x.fillStyle='#9cc7e8';x.fillRect(0,0,W,H);face(60+420*0.3,1250-420+420*0.33,52,{...NAR,eyeOpen:on?0.15:1,smile:on?-0.6:0.4,sad:on?0.6:0});x.restore();
  if(!on){const p=eOut(prog(t,0.1,1.3));const tx=1300-p*560;x.save();x.translate(tx,1180);x.fillStyle='#f4f4f4';rr(-170,-200,250,190,10);x.fill();x.fillStyle='#2b6cb0';rr(80,-140,110,130,14);x.fill();x.fillStyle='#22304f';x.fillRect(110,-125,60,45);[-110,20,140].forEach(w=>{x.fillStyle='#111';x.beginPath();x.arc(w,0,34,0,7);x.fill()});x.fillStyle='#2b6cb0';x.font=`800 30px ${F}`;x.textAlign='center';x.fillText('NAKLİYAT',-45,-100);x.restore();}
  else{speaker(810,1080,0.85,t,true);clock(540,330,130,'06:00',t<2.8?t:0);}
  caption('Sokağımıza yeni biri taşındı.',t,0.29,2.18);
  caption('Her sabah, saat altıda, son ses müzik açıyordu.',t,2.2,5.4);
}});
// 2 DOOR
S.push({d:3.77,f(t){
  x.save();shake(t,3.3,3.7,22);
  x.fillStyle='#d9c3a0';x.fillRect(-40,-40,W+80,H+80);
  x.fillStyle='#7a5a3a';x.fillRect(540,330,420,1000);
  const open=t>2.33&&t<3.3?eOut(prog(t,2.33,2.6)):(t>=3.3?1-eOut(prog(t,3.3,3.42)):0);
  // dark interior + neighbor
  x.fillStyle='#1a1410';x.fillRect(560,350,380,980);
  if(open>0.05){body(750,780,300,600,'#7a7f87');face(750,620,120,{...NEI,angry:1,smile:-0.5});}
  x.fillStyle='#8b5e3c';x.fillRect(560,350,380*(1-open*0.85),980);x.fillStyle='#6b4428';for(let k=0;k<3;k++)x.fillRect(600,420+k*300,300*(1-open*0.85),12);
  x.fillStyle='#e0b84a';if(open<0.5){x.beginPath();x.arc(900,860,16,0,7);x.fill();}
  // narrator
  body(280,1060,300,700,'#3f8f5f');face(280,900,125,{...NAR,smile:t<2.33?0.5:(t<3.3?-0.2:-0.4),brow:t>2.4?0.6:0.2,eyeOpen:1,look:1});
  if(t<2.33){bigText('TOK',760,520,80,'#fff',prog(t,0.3,0.45),-0.2);bigText('TOK',820,640,80,'#fff',prog(t,0.6,0.75),0.15);}
  bigText('BAM!',750,520,150,'#ff5a5a',prog(t,3.3,3.45),-0.1);
  x.restore();
  caption('Kapısını çaldım. Rica ettim.',t,0.23,2.31);
  caption('Yüzüme kapıyı kapattı.',t,2.33,3.75,{size:76});
}});
// 3 POLICE -> AGAIN
S.push({d:6.4,f(t){
  if(t<3.25){
